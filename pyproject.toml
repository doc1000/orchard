[project]
name = "orchard"
version = "0.1.0"
description = "Local-first hierarchical trees over a fixed document corpus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.9,<1",
]
embeddings = [
    "torch>=2.2",
    "transformers>=4.41",
]
taxonomy-ml = [
    "torch>=2.2",
    "transformers>=4.41",
]
ml = [
    "torch>=2.2",
    "transformers>=4.41",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
pythonpath = ["src"]
markers = [
    "optional_model: live neural model; may use a local snapshot and is not required in CI",
]
